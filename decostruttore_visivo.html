<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decostruttore Visivo</title>
    <style>
        /* * VARIABILI DI STILE
         * Palette scura minimale e accento smeraldo.
         */
        :root {
            --bg-main: #0f1115;
            --bg-sidebar: #1a1d24;
            --bg-input: #2a2e37;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --border: #334155;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* RESET E IMPOSTAZIONI BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* LAYOUT PRINCIPALE */
        .sidebar {
            width: 350px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
            flex-shrink: 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .workspace {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Background pattern a griglia per un look "tecnico" */
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center;
            overflow: hidden;
            padding: 2rem;
        }

        /* CUSTOM SCROLLBAR SIDEBAR */
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .sidebar::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* ELEMENTI SIDEBAR */
        .header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .control-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            color: var(--accent);
            font-weight: 600;
        }

        /* STILI INPUT, SELECT E BOTTONI */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-input);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus { border-color: var(--accent); }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            font-size: 0.85rem;
            user-select: none;
        }

        .checkbox-container input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.875rem;
            background-color: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--border);
        }

        .btn-accent {
            background-color: var(--accent);
            color: #fff;
            border: none;
            margin-top: auto; /* Spinge il pulsante in fondo alla sidebar */
        }

        .btn-accent:hover {
            background-color: var(--accent-hover);
        }

        input[type="file"] {
            display: none;
        }

        /* EMPTY STATE & CANVAS */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
            gap: 1rem;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            opacity: 0.5;
        }

        canvas {
            display: none; /* Nascosto fino al caricamento dell'immagine */
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: transparent;
        }

        /* Utility per il Nearest Neighbor */
        canvas.pixelated {
            image-rendering: pixelated; /* Chrome, Edge, Safari */
            image-rendering: crisp-edges; /* Firefox */
        }

    </style>
</head>
<body>

    <!-- SIDEBAR CONTROLLI -->
    <aside class="sidebar">
        <div class="header">
            <h1>Decostruttore Visivo</h1>
            <div class="subtitle">NTA - Progetto d'esame</div>
        </div>

        <div class="control-group">
            <label for="file-upload" class="btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Carica Immagine
            </label>
            <input type="file" id="file-upload" accept="image/jpeg, image/png">
        </div>

        <div class="control-group">
            <label>
                Risoluzione (Griglia Pixel)
                <span class="val-display" id="res-val">128</span>
            </label>
            <input type="range" id="resolution" min="16" max="512" step="16" value="128">
        </div>

        <div class="control-group">
            <label>
                Rumore (Low Samples)
                <span class="val-display" id="noise-val">15%</span>
            </label>
            <input type="range" id="noise" min="0" max="100" step="1" value="15">
        </div>

        <div class="control-group">
            <label>Profondità Colore</label>
            <select id="color-depth">
                <option value="truecolor">True Color</option>
                <option value="64">64 Colori (Retro Console)</option>
                <option value="16">16 Colori (Stile 8-bit)</option>
                <option value="8">8 Colori (Teletext)</option>
                <option value="gameboy">Scala di Grigi (GameBoy)</option>
            </select>
        </div>

        <div class="control-group" style="margin-bottom: 2rem;">
            <label class="checkbox-container">
                <input type="checkbox" id="nearest-neighbor" checked>
                Interpolazione Nearest Neighbor (Bordi netti)
            </label>
        </div>

        <button class="btn btn-accent" id="export-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Esporta Opera Finale
        </button>
    </aside>

    <!-- AREA DI LAVORO -->
    <main class="workspace">
        <div class="empty-state" id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <p>Nessuna immagine caricata.<br>Utilizza il pannello laterale per iniziare.</p>
        </div>
        <!-- Canvas Visibile e finale -->
        <canvas id="main-canvas" class="pixelated"></canvas>
    </main>

    <script>
        // --- INIZIALIZZAZIONE ELEMENTI DOM ---
        const fileUpload = document.getElementById('file-upload');
        const resInput = document.getElementById('resolution');
        const noiseInput = document.getElementById('noise');
        const colorDepthSelect = document.getElementById('color-depth');
        const nnCheckbox = document.getElementById('nearest-neighbor');
        const exportBtn = document.getElementById('export-btn');
        
        const resValDisplay = document.getElementById('res-val');
        const noiseValDisplay = document.getElementById('noise-val');
        
        const emptyState = document.getElementById('empty-state');
        const mainCanvas = document.getElementById('main-canvas');
        const mainCtx = mainCanvas.getContext('2d');

        // Immagine originale memorizzata in memoria
        let originalImage = null;

        // Palette predefinite per effetti retro
        // GameBoy classica (4 sfumature di verde/grigio)
        const gameboyPalette = [
            [15, 56, 15],     // Ombra scura
            [48, 98, 48],     // Mezzotono scuro
            [139, 172, 15],   // Mezzotono chiaro
            [155, 188, 15]    // Luce
        ];

        // Palette EGA 16 Colori per lo stile 8-bit puro
        const egaPalette = [
            [0,0,0], [0,0,170], [0,170,0], [0,170,170],
            [170,0,0], [170,0,170], [170,85,0], [170,170,170],
            [85,85,85], [85,85,255], [85,255,85], [85,255,255],
            [255,85,85], [255,85,255], [255,255,85], [255,255,255]
        ];

        // --- EVENT LISTENERS ---

        // Aggiornamento dei testi dei valori
        resInput.addEventListener('input', () => {
            resValDisplay.textContent = resInput.value;
            if(originalImage) processImage();
        });

        noiseInput.addEventListener('input', () => {
            noiseValDisplay.textContent = noiseInput.value + '%';
            if(originalImage) processImage();
        });

        colorDepthSelect.addEventListener('change', () => {
            if(originalImage) processImage();
        });

        nnCheckbox.addEventListener('change', () => {
            // Applica o rimuove la classe CSS per il rendering hardware
            if (nnCheckbox.checked) {
                mainCanvas.classList.add('pixelated');
            } else {
                mainCanvas.classList.remove('pixelated');
            }
            if(originalImage) processImage();
        });

        // Gestione caricamento File
        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    emptyState.style.display = 'none';
                    mainCanvas.style.display = 'block';
                    processImage();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Gestione Esportazione
        exportBtn.addEventListener('click', () => {
            if (!originalImage) {
                alert("Carica prima un'immagine per esportarla!");
                return;
            }

            const resVal = resInput.value;
            const noiseVal = noiseInput.value;
            // Genera il nome file seguendo la direttiva
            const filename = `Giordano_Giuseppe_AntropoceneCompresso_Res${resVal}_Noise${noiseVal}.png`;
            
            // Crea il download tramite un link temporaneo
            const link = document.createElement('a');
            link.download = filename;
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
        });

        // --- FUNZIONI DI ELABORAZIONE ---

        // Helper: Calcola distanza Euclidea per trovare il colore più vicino in una palette
        function getNearestColor(r, g, b, palette) {
            let minDistance = Infinity;
            let bestColor = palette[0];
            
            for (let i = 0; i < palette.length; i++) {
                const pr = palette[i][0];
                const pg = palette[i][1];
                const pb = palette[i][2];
                // Distanza al quadrato (più veloce di Math.sqrt)
                const distance = (r - pr)**2 + (g - pg)**2 + (b - pb)**2;
                
                if (distance < minDistance) {
                    minDistance = distance;
                    bestColor = palette[i];
                }
            }
            return bestColor;
        }

        // Helper: Arrotonda ai livelli specificati (utile per RGB puri)
        function quantizeChannel(value, levels) {
            const step = 255 / (levels - 1);
            return Math.round(Math.round(value / step) * step);
        }

        // Funzione Principale di Decostruzione
        function processImage() {
            if (!originalImage) return;

            // 1. Lettura dei parametri attuali
            const maxRes = parseInt(resInput.value, 10);
            const noisePercent = parseInt(noiseInput.value, 10);
            const noiseFactor = noisePercent * 2.55; // Mappa 0-100 a 0-255
            const depth = colorDepthSelect.value;
            const useNN = nnCheckbox.checked;

            // 2. Calcolo dimensioni Off-Screen Canvas (bassa risoluzione)
            const ratio = originalImage.width / originalImage.height;
            let offW, offH;
            
            if (originalImage.width > originalImage.height) {
                offW = maxRes;
                offH = Math.round(maxRes / ratio);
            } else {
                offH = maxRes;
                offW = Math.round(maxRes * ratio);
            }

            // Evitiamo dimensioni nulle
            if (offW === 0) offW = 1;
            if (offH === 0) offH = 1;

            // Creazione Canvas Off-Screen
            const offCanvas = document.createElement('canvas');
            offCanvas.width = offW;
            offCanvas.height = offH;
            const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

            // Disegna l'immagine rimpicciolita
            offCtx.drawImage(originalImage, 0, 0, offW, offH);

            // 3. Estrazione e Manipolazione Pixel per Pixel
            const imageData = offCtx.getImageData(0, 0, offW, offH);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                // --- A) APPLICAZIONE RUMORE (Low Samples Simulation) ---
                if (noiseFactor > 0) {
                    const noiseR = (Math.random() - 0.5) * 2 * noiseFactor;
                    const noiseG = (Math.random() - 0.5) * 2 * noiseFactor;
                    const noiseB = (Math.random() - 0.5) * 2 * noiseFactor;
                    
                    r = Math.max(0, Math.min(255, r + noiseR));
                    g = Math.max(0, Math.min(255, g + noiseG));
                    b = Math.max(0, Math.min(255, b + noiseB));
                }

                // --- B) QUANTIZZAZIONE COLORE (Obsolescenza tecnologica) ---
                if (depth === '64') {
                    // 64 Colori: 4 livelli per canale (4 * 4 * 4 = 64)
                    r = quantizeChannel(r, 4);
                    g = quantizeChannel(g, 4);
                    b = quantizeChannel(b, 4);
                } 
                else if (depth === '16') {
                    // 16 Colori: Mapping alla classica palette EGA
                    const mappedColor = getNearestColor(r, g, b, egaPalette);
                    r = mappedColor[0];
                    g = mappedColor[1];
                    b = mappedColor[2];
                } 
                else if (depth === '8') {
                    // 8 Colori (Teletext style): 2 livelli per canale (0 o 255)
                    r = quantizeChannel(r, 2);
                    g = quantizeChannel(g, 2);
                    b = quantizeChannel(b, 2);
                } 
                else if (depth === 'gameboy') {
                    // Scala di Grigi / GameBoy: Calcolo Luminanza e mapping sui 4 toni
                    const luma = 0.299 * r + 0.587 * g + 0.114 * b;
                    // Mappa la luminanza da 0-255 a un indice 0-3
                    const lumaIndex = Math.floor((luma / 256) * 4); 
                    
                    const gbColor = gameboyPalette[lumaIndex];
                    r = gbColor[0];
                    g = gbColor[1];
                    b = gbColor[2];
                }

                // Assegnazione nuovi valori all'array dei pixel
                data[i] = r;
                data[i + 1] = g;
                data[i + 2] = b;
                // data[i+3] è l'Alpha, che lasciamo inalterato
            }

            // Riposiziona l'ImageData elaborato nell'off-screen canvas
            offCtx.putImageData(imageData, 0, 0);

            // 4. Upscaling per Render Finale (Qualità Esportazione Alta)
            // Stabiliamo una base larga per avere un'esportazione pulita e grande
            const baseExportSize = 1000;
            const scaleFactor = Math.ceil(baseExportSize / Math.max(offW, offH));
            
            const exportW = offW * scaleFactor;
            const exportH = offH * scaleFactor;

            // Aggiorna dimensioni canvas principale visibile
            mainCanvas.width = exportW;
            mainCanvas.height = exportH;

            // Pulisce il canvas e applica i settaggi di interpolazione
            mainCtx.clearRect(0, 0, exportW, exportH);
            
            // Imposta l'interpolazione JS in base al toggle
            // (Fondamentale in combinazione con il CSS image-rendering)
            mainCtx.imageSmoothingEnabled = !useNN;
            
            // Disegna l'immagine elaborata ingrandendola massicciamente
            mainCtx.drawImage(offCanvas, 0, 0, exportW, exportH);
        }
    </script>
</body>
</html>
